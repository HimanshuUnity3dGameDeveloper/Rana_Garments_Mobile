<section class="header">
    <img src="assets/img/Logo.png" alt="logo">
    <div>
        <ul id="navbar" [class.active]="isNavbarActive">
            <li><a routerLink="/home" routerLinkActive="active">Home</a></li>
            <li><a routerLink="/shop" routerLinkActive="active">Shop</a></li>
            <li><a routerLink="/blog" routerLinkActive="active">Blog</a></li>
            <li><a routerLink="/about" routerLinkActive="active">About</a></li>
            <li><a routerLink="/contact" routerLinkActive="active">Contact</a></li>
            <li id="lg-bag"><a routerLink="/cart" routerLinkActive="active"><i class="bi bi-cart"></i></a></li>
            <a id="close" (click)="closeNavbar()"><i class="bi bi-x-lg"></i></a>
        </ul>
    </div>
    <div id="mobile">
        <a routerLink="/cart" routerLinkActive="active"><i class="bi bi-cart"></i></a>
        <a (click)="openNavbar()"><i id="bar" class="bi bi-list"></i></a>
    </div>
</section>
