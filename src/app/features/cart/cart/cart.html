<section class="cart-section">
    <table width="100%">
        <thead>
            <tr>
                <th>PRODUCT</th>
                <th>IMAGE</th>
                <th>PRICE</th>
                <th>QUANTITY</th>
                <th>SUBTOTAL</th>
                <th>REMOVE</th>
            </tr>
        </thead>
        <tbody id="cart_body">
            <tr *ngFor="let prod of itemlist">                
                <td>{{prod.prodName}}</td>
                <td><img [src]="prod.mainImage" alt=""></td>
                <td>{{prod.prod_Price}}</td>
                <td>{{prod.quantity}}</td>
                <td>{{totalPay}}</td>
                <td><a (click)="removeItem(prod.id)"><i class="bi bi-x-lg"></i></a></td>
            </tr>
        </tbody>
    </table>
</section>
